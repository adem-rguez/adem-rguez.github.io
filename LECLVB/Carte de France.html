	<div id="map-tooltip" style="position:fixed;pointer-events:none;display:none;background:rgba(0,0,0,0.85);color:#fff;padding:6px 10px;border-radius:4px;font:13px/1.4 sans-serif;max-width:240px;z-index:1000;"></div>
	<script>
	(function () {
		var tooltip = document.getElementById('map-tooltip');
		fetch('tooltips.json')
			.then(function (r) { return r.json(); })
			.then(function (data) {
				document.querySelectorAll('g.region').forEach(function (g) {
					var code = g.getAttribute('data-code_insee');
					var info = data[code] || {};
					var nom = info.nom || g.getAttribute('data-nom');
					var text = info.text || '';

					g.addEventListener('mousemove', function (e) {
						tooltip.style.left = (e.clientX + 12) + 'px';
						tooltip.style.top = (e.clientY + 12) + 'px';
					});
					g.addEventListener('mouseenter', function () {
						tooltip.innerHTML = '';
						var title = document.createElement('strong');
						title.textContent = nom;
						tooltip.appendChild(title);
						if (text) {
							tooltip.appendChild(document.createElement('br'));
							tooltip.appendChild(document.createTextNode(text));
						}
						tooltip.style.display = 'block';
					});
					g.addEventListener('mouseleave', function () {
						tooltip.style.display = 'none';
					});
				});
			})
			.catch(function (err) {
				console.error('Could not load tooltips.json (must be served over http/https, not opened as a local file):', err);
			});
	})();
	</script>
